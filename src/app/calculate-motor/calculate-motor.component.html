
<mat-card>
  <mat-card-title>Cálculo dos Componentes do Motor</mat-card-title>
  <form (ngSubmit)="calcularComponentes()" #motorForm="ngForm" autocomplete="off">
    <div style="display: flex; flex-wrap: wrap; gap: 16px;">
      <mat-form-field appearance="outline">
        <mat-label>Potência [CV]</mat-label>
        <input matInput type="number" [(ngModel)]="potenciaCV" name="potenciaCV" required>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Rendimento</mat-label>
        <input matInput type="number" step="0.01" [(ngModel)]="rendimento" name="rendimento" required>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Fator de Potência</mat-label>
        <input matInput type="number" step="0.01" [(ngModel)]="fatorPotencia" name="fatorPotencia" required>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>IP/IN</mat-label>
        <input matInput type="number" step="0.01" [(ngModel)]="ipIn" name="ipIn">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>tp</mat-label>
        <input matInput type="number" step="0.01" [(ngModel)]="tp" name="tp">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>trb</mat-label>
        <input matInput type="number" step="0.01" [(ngModel)]="trb" name="trb">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Tensão [V]</mat-label>
        <input matInput type="number" [(ngModel)]="tensao" name="tensao" required>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Queda de Tensão [%]</mat-label>
        <input matInput type="number" step="0.1" [(ngModel)]="quedaTensao" name="quedaTensao">
      </mat-form-field>
    </div>
    <div style="margin-top: 16px;">
      <button mat-raised-button color="primary" type="submit">Calcular</button>
    </div>
  </form>
</mat-card>

<mat-card *ngIf="contatores" style="margin-top: 24px;">
  <mat-card-title>Resultados</mat-card-title>
  <mat-card-content>
    <p>{{ contatores }}</p>
    <p>{{ fusivel }}</p>
    <p>{{ releTermico }}</p>
    <p>Condutor recomendado: {{ condutor }}</p>
  </mat-card-content>
</mat-card>
